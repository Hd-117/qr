<!DOCTYPE html>
<html lang="es">
<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <link rel="apple-touch-icon" href="conecta.png">
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  
  <meta name="apple-mobile-web-app-title" content="Registro">
  
  <title>Registro Pacientes</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    body {

      font-family: Arial, sans-serif;
      background: #f5f5f5;

      margin: 0;
      padding: 20px;

      text-align: center;
    }

    h1 {

      margin-bottom: 10px;
    }

    #reader {

      width: 320px;
      margin: auto;

      border-radius: 12px;
      overflow: hidden;

      background: white;
      padding: 10px;
    }

    #status {

      margin-top: 20px;

      font-size: 20px;
      font-weight: bold;
    }

    .ok {

      color: green;
    }

    .error {

      color: red;
    }

    #modulo {

      margin-bottom: 20px;
      font-size: 18px;
    }
    img{
        height: 200px;
        width: 200px;
    }

  </style>

</head>

<body>

  <h1><img src="conecta.png" alt=""></h1>

  <div id="modulo"></div>

  <div id="reader"></div>

  <div id="status"></div>

  <script>

    // =========================================
    // CONFIGURACIÓN
    // =========================================

    const API_URL =
      "https://script.google.com/macros/s/AKfycbw2Z1Co0_gVuXAipOpZN_xRGkGZWMN_baT3J8r6r7d4SGTTUzIXJTOW24lYxl3DI-E7Gg/exec";

    let API_KEY = localStorage.getItem("apiKey");

    if (!API_KEY) {

    API_KEY = prompt("Ingresa API KEY");

    localStorage.setItem(
        "apiKey",
        API_KEY
    );
    }

    let scanning = true;

    async function registrarPaciente(numeroPaciente) {

      try {

        const response = await fetch(
          API_URL,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({

              paciente:
                numeroPaciente,

              apiKey:
                API_KEY
            })
          }
        );

        const data =
          await response.json();

        const status =
          document.getElementById(
            "status"
          );

        if (data.success) {

          status.className = "ok";

          status.innerHTML = `
            ✅ ${data.accion}<br>
            Paciente: ${data.paciente}<br>
            ${data.modulo}
          `;

        } else {

          status.className = "error";

          status.innerHTML =
            `❌ ${data.error}`;
        }

      } catch (err) {

        const status =
          document.getElementById(
            "status"
          );

        status.className = "error";

        status.innerHTML =
          `❌ Error conexión`;
      }

      // evitar doble scan instantáneo

      setTimeout(() => {

        scanning = true;

      }, 2000);
    }

    function onScanSuccess(decodedText) {

      if (!scanning) return;

      scanning = false;

      console.log(
        "QR:",
        decodedText
      );

      registrarPaciente(
        decodedText
      );
    }

    const html5QrCode =
      new Html5Qrcode("reader");

    html5QrCode.start(

      {
        facingMode:
          "environment"
      },

      {
        fps: 10,
        qrbox: 250
      },

      onScanSuccess
    );

  </script>

</body>
</html>
